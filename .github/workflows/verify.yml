name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # Tests run under node --test and never load Electron; skip the binary download on npm ci.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # No engines/.nvmrc in repo; electron@44.4.5 requires node >= 22.12.0
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run verify
